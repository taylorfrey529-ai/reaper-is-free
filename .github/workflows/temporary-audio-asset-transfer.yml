name: Temporary Metal GTX extraction bridge

on:
  push:
    branches:
      - asset-transfer-sforzando-metal-gtx-20260921

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and extract Metal GTX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          cd transfer
          python3 -m pip install --disable-pip-version-check -q gdown
          gdown "1FurY3_x_tog_56irX1VDNyRCUt5JD7bO" -O UI_METAL-GTX.rar
          command -v 7z
          mkdir metal-gtx
          7z x -y UI_METAL-GTX.rar -ometal-gtx
          find metal-gtx -type f -printf '%P\n' | sort > METAL_GTX_FILES.txt
          tar -C metal-gtx -czf metal-gtx-extracted.tar.gz .
          sha256sum metal-gtx-extracted.tar.gz > EXTRACTED_SHA256SUMS
          du -sh metal-gtx metal-gtx-extracted.tar.gz | tee EXTRACTED_SIZES.txt
          split -b 70M -d -a 3 metal-gtx-extracted.tar.gz metal-gtx-extracted.part.
          ls -lh metal-gtx-extracted.part.* >> EXTRACTED_SIZES.txt

      - name: Upload extracted manifest
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-extracted-manifest
          path: |
            transfer/EXTRACTED_SHA256SUMS
            transfer/EXTRACTED_SIZES.txt
            transfer/METAL_GTX_FILES.txt
          compression-level: 0

      - name: Upload extracted Metal GTX chunk 000
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-extracted-000
          path: transfer/metal-gtx-extracted.part.000
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload extracted Metal GTX chunk 001
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-extracted-001
          path: transfer/metal-gtx-extracted.part.001
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload extracted Metal GTX chunk 002
