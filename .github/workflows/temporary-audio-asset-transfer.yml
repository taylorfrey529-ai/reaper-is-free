name: Temporary audio asset transfer bridge

on:
  push:
    branches:
      - asset-transfer-sforzando-metal-gtx-20260921

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch official assets and split for connector transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          cd transfer

          curl -fL --retry 5 --retry-delay 2 \
            -o LINUX_plogue-sforzando_1.982_x86_64.zip \
            "https://sforzando.s3.us-east-1.amazonaws.com/LINUX_plogue-sforzando_1.982_x86_64.zip"

          python3 -m pip install --disable-pip-version-check -q gdown
          gdown "1FurY3_x_tog_56irX1VDNyRCUt5JD7bO" -O UI_METAL-GTX.rar

          sha256sum LINUX_plogue-sforzando_1.982_x86_64.zip UI_METAL-GTX.rar | tee SHA256SUMS
          split -b 70M -d -a 3 UI_METAL-GTX.rar metal-gtx.part.
          ls -lh LINUX_plogue-sforzando_1.982_x86_64.zip UI_METAL-GTX.rar metal-gtx.part.* | tee FILES.txt

      - name: Upload sforzando
        uses: actions/upload-artifact@v4
        with:
          name: sforzando-linux-1.982
          path: transfer/LINUX_plogue-sforzando_1.982_x86_64.zip
          compression-level: 0

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: |
            transfer/SHA256SUMS
            transfer/FILES.txt
          compression-level: 0

      - name: Upload Metal GTX chunk 000
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-000
          path: transfer/metal-gtx.part.000
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Metal GTX chunk 001
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-001
          path: transfer/metal-gtx.part.001
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Metal GTX chunk 002
