name: Bundle Black Green Guitar Replacement
on:
  push:
    branches:
      - tmp/standard-guitar-replacement-20260921
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact replacement
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/sfzinstruments/karoryfer.black-and-green-guitars.git Black-And-Green-Guitars
          cd Black-And-Green-Guitars
          git rev-parse HEAD | tee ../SOURCE-COMMIT.txt
          cd ..
          test -f 'Black-And-Green-Guitars/Programs/01-green_keyswitch.sfz'
          test -f 'Black-And-Green-Guitars/Programs/02-black_keyswitch.sfz'
          find Black-And-Green-Guitars/Samples -type f | wc -l | tee SAMPLE-COUNT.txt
          tar -cf black-and-green-guitars.tar Black-And-Green-Guitars
          sha256sum black-and-green-guitars.tar | tee black-and-green-guitars.tar.sha256
          split -b 180M -d -a 2 black-and-green-guitars.tar black-and-green.part-
          sha256sum black-and-green.part-* > PARTS-SHA256SUMS.txt
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: black-green-manifest
          path: |
            SOURCE-COMMIT.txt
            SAMPLE-COUNT.txt
            black-and-green-guitars.tar.sha256
            PARTS-SHA256SUMS.txt
          retention-days: 1
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: black-green-part-00
          path: black-and-green.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: black-green-part-01
          path: black-and-green.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: black-green-part-02
          path: black-and-green.part-02
          compression-level: 0
          retention-days: 1
