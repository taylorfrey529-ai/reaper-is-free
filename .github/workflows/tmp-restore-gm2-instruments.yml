name: Restore GM2 Instruments
on:
  push:
    branches:
      - tmp/restore-gm2-instruments-20260920
permissions:
  contents: read

jobs:
  black-blue:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch library
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/sfzinstruments/karoryfer.black-and-blue-basses.git Black-And-Blue-Basses
          rm -rf Black-And-Blue-Basses/.git
          tar -cf black-and-blue-basses.tar Black-And-Blue-Basses
          sha256sum black-and-blue-basses.tar > black-and-blue-basses.sha256
          split -b 300M black-and-blue-basses.tar black-and-blue-basses.part-
      - name: Upload pieces
        uses: actions/upload-artifact@v4
        with:
          name: black-and-blue-basses-parts
          path: |
            black-and-blue-basses.part-*
            black-and-blue-basses.sha256
          compression-level: 0
          retention-days: 1

  metal-gtx:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Metal GTX
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet gdown
          gdown 1FurY3_x_tog_56irX1VDNyRCUt5JD7bO -O metal-gtx.pack
          test -s metal-gtx.pack
          file metal-gtx.pack
          sha256sum metal-gtx.pack > metal-gtx.sha256
          split -b 300M metal-gtx.pack metal-gtx.part-
      - name: Upload pieces
        uses: actions/upload-artifact@v4
        with:
          name: metal-gtx-parts
          path: |
            metal-gtx.part-*
            metal-gtx.sha256
          compression-level: 0
          retention-days: 1
