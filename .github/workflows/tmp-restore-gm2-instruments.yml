name: Restore GM2 Exact AVL
on:
  push:
    branches:
      - tmp/restore-gm2-instruments-20260920
permissions:
  contents: read

jobs:
  avldrums-exact:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config lv2-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libglu1-mesa-dev libgl1-mesa-dev libx11-dev
      - name: Checkout exact source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/x42/avldrums.lv2.git src
          cd src
          git checkout 9389f16f139410d9a55f9006976bd54cbd8b7806
          git submodule update --init --recursive
          test "$(git -C robtk rev-parse HEAD)" = "c6c3ade30b1cffb12e4cd6eda5a46bf1c96cb318"
      - name: Build exact AVLDrums
        shell: bash
        run: |
          set -euxo pipefail
          cd src
          make -j2
          rm -rf ../stage
          make install DESTDIR="$PWD/../stage" PREFIX=/usr
          cd ..
          sha256sum stage/usr/lib/lv2/avldrums.lv2/avldrums.so
          sha256sum stage/usr/lib/lv2/avldrums.lv2/avldrumsUI_gl.so
          sha256sum stage/usr/lib/lv2/avldrums.lv2/Black_Pearl_4_LV2.sf2
          tar -C stage/usr/lib/lv2 -czf avldrums-exact.tar.gz avldrums.lv2
          sha256sum avldrums-exact.tar.gz > avldrums-exact.tar.gz.sha256
      - name: Upload exact AVL
        uses: actions/upload-artifact@v4
        with:
          name: avldrums-exact-9389f16
          path: |
            avldrums-exact.tar.gz
            avldrums-exact.tar.gz.sha256
          compression-level: 0
          retention-days: 1
