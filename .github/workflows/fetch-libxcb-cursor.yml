name: Fetch libxcb-cursor

on:
  push:
    branches:
      - linux-ububtu-vm-workspace
    paths:
      - .github/workflows/fetch-libxcb-cursor.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Debian trixie libxcb-cursor0
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4             'https://ftp.debian.org/debian/pool/main/x/xcb-util-cursor/libxcb-cursor0_0.1.5-1_amd64.deb'             -o libxcb-cursor0_0.1.5-1_amd64.deb
          echo 'e0c77e6e96843581ff2668dc9a10f676be0e78209ef198e98646184858efe164  libxcb-cursor0_0.1.5-1_amd64.deb' | sha256sum -c -
          sha256sum libxcb-cursor0_0.1.5-1_amd64.deb > SHA256SUMS.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: libxcb-cursor0-trixie-amd64
          path: |
            libxcb-cursor0_0.1.5-1_amd64.deb
            SHA256SUMS.txt
          retention-days: 1
