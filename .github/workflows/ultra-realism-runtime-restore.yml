name: Ultra Realism Runtime Restore

on:
  push:
    branches:
      - temp/ultra-realism-runtime-restore-20260923
    paths:
      - .github/workflows/ultra-realism-runtime-restore.yml

permissions:
  contents: read

jobs:
  sforzando:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official sforzando 1.982 Linux x86_64
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 'https://sforzando.s3.us-east-1.amazonaws.com/LINUX_plogue-sforzando_1.982_x86_64.zip' -o LINUX_plogue-sforzando_1.982_x86_64.zip
          sha256sum LINUX_plogue-sforzando_1.982_x86_64.zip > sforzando.sha256
          unzip -l LINUX_plogue-sforzando_1.982_x86_64.zip | tee sforzando.contents.txt
      - name: Upload sforzando
        uses: actions/upload-artifact@v4
        with:
          name: sforzando-1.982-linux-x86_64
          path: |
            LINUX_plogue-sforzando_1.982_x86_64.zip
            sforzando.sha256
            sforzando.contents.txt
          compression-level: 0
          retention-days: 1

  avldrums:
    runs-on: ubuntu-latest
    steps:
      - name: Build pinned AVLDrums LV2
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git lv2-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev
          git clone https://github.com/x42/avldrums.lv2.git src
          cd src
          git checkout 9389f16f139410d9a55f9006976bd54cbd8b7806
          make submodules
          make -j2
          make install DESTDIR="$GITHUB_WORKSPACE/stage" PREFIX=/usr
          cd "$GITHUB_WORKSPACE"
          sha256sum stage/usr/lib/lv2/avldrums.lv2/avldrums.so > avldrums-binary.sha256
          find stage/usr/lib/lv2/avldrums.lv2 -type f -print0 | sort -z | xargs -0 sha256sum > avldrums-files.sha256
          tar -C stage/usr/lib/lv2 -czf avldrums.lv2-9389f16.tar.gz avldrums.lv2
          sha256sum avldrums.lv2-9389f16.tar.gz > avldrums-archive.sha256
      - name: Upload AVLDrums
        uses: actions/upload-artifact@v4
        with:
          name: avldrums-lv2-9389f16
          path: |
            avldrums.lv2-9389f16.tar.gz
            avldrums-binary.sha256
            avldrums-files.sha256
            avldrums-archive.sha256
          compression-level: 0
          retention-days: 1


  vsco:
    runs-on: ubuntu-latest
    steps:
      - name: Build pinned VSCO 2 CE 1.1.0 subset
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.1.0 https://github.com/sgossner/VSCO-2-CE.git src
          mkdir -p stage/VSCO-2-CE
          cp src/ViolinEnsSusVib.sfz stage/VSCO-2-CE/
          cp src/CelloEnsSusVib.sfz stage/VSCO-2-CE/
          cp src/FHornSus.sfz stage/VSCO-2-CE/
          mkdir -p 'stage/VSCO-2-CE/Strings/Violin Section' 'stage/VSCO-2-CE/Strings/Cello Section' 'stage/VSCO-2-CE/Brass/F Horn'
          cp -a 'src/Strings/Violin Section/susVib' 'stage/VSCO-2-CE/Strings/Violin Section/'
          cp -a 'src/Strings/Cello Section/susvib' 'stage/VSCO-2-CE/Strings/Cello Section/'
          cp -a 'src/Brass/F Horn/sus' 'stage/VSCO-2-CE/Brass/F Horn/'
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('stage/VSCO-2-CE')
          missing=[]
          for sfz in ['ViolinEnsSusVib.sfz','CelloEnsSusVib.sfz','FHornSus.sfz']:
              text=(root/sfz).read_text(errors='replace')
              m=re.search(r'default_path=(.+)',text,re.I)
              base=(m.group(1).strip().replace('\\','/') if m else '')
              for sample in re.findall(r'^sample=(.+)$',text,re.I|re.M):
                  p=root/base/sample.strip()
                  if not p.exists(): missing.append(str(p))
          if missing:
              print('\n'.join(missing),file=sys.stderr); sys.exit(1)
          PY
          find stage/VSCO-2-CE -type f -print0 | sort -z | xargs -0 sha256sum > VSCO-2-CE-subset-files.sha256
          tar -C stage -cf VSCO-2-CE-subset.tar VSCO-2-CE
          sha256sum VSCO-2-CE-subset.tar > VSCO-2-CE-subset.tar.sha256
          split -b 180M -d -a 3 VSCO-2-CE-subset.tar VSCO-2-CE-subset.tar.part.
          printf 'tag=1.1.0\ncommit=' > VSCO-2-CE-provenance.txt
          git -C src rev-parse HEAD >> VSCO-2-CE-provenance.txt
          ls -lh VSCO-2-CE-subset.tar.part.*
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-manifest
          path: |
            VSCO-2-CE-subset.tar.sha256
            VSCO-2-CE-subset-files.sha256
            VSCO-2-CE-provenance.txt
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-000
          path: VSCO-2-CE-subset.tar.part.000
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-001
          path: VSCO-2-CE-subset.tar.part.001
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-002
          path: VSCO-2-CE-subset.tar.part.002
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-003
          path: VSCO-2-CE-subset.tar.part.003
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-004
          path: VSCO-2-CE-subset.tar.part.004
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vsco-subset-005
          path: VSCO-2-CE-subset.tar.part.005
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
