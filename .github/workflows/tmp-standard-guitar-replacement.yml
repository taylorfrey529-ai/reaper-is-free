name: Fetch Standard Guitar Replacement
on:
  push:
    branches:
      - tmp/standard-guitar-replacement-20260921
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Unreal Instruments Standard Guitar
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --quiet gdown
          mkdir -p out
          gdown 'https://drive.google.com/uc?id=1uoV7icZV1_IjiOGKM7Wm5_K5UkF41Fm3' -O out/Standard_Guitar.rar
          test -s out/Standard_Guitar.rar
          file out/Standard_Guitar.rar | tee out/file-type.txt
          sha256sum out/Standard_Guitar.rar | tee out/Standard_Guitar.rar.sha256
          stat -c '%s' out/Standard_Guitar.rar | tee out/Standard_Guitar.rar.size
          split -b 180M -d -a 2 out/Standard_Guitar.rar out/Standard_Guitar.part-
          sha256sum out/Standard_Guitar.part-* > out/Standard_Guitar.parts.sha256
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: standard-guitar-manifest
          path: |
            out/Standard_Guitar.rar.sha256
            out/Standard_Guitar.rar.size
            out/Standard_Guitar.parts.sha256
            out/file-type.txt
          retention-days: 1
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: standard-guitar-part-00
          path: out/Standard_Guitar.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: standard-guitar-part-01
          path: out/Standard_Guitar.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: standard-guitar-part-02
          path: out/Standard_Guitar.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: standard-guitar-part-03
          path: out/Standard_Guitar.part-03
          compression-level: 0
          retention-days: 1
