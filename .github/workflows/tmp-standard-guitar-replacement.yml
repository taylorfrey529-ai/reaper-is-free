name: Fetch Guitar Replacement
on:
  push:
    branches:
      - tmp/standard-guitar-replacement-20260921
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct exact tree from Git blob objects
        shell: bash
        run: |
          set -euxo pipefail
          COMMIT='b3b3249d37dc977a1a297bd2dc053e6d9b6b805c'
          git clone --depth=1 --no-checkout https://github.com/sfzinstruments/karoryfer.black-and-green-guitars.git source-repo
          test "$(git -C source-repo rev-parse HEAD)" = "$COMMIT"
          printf '%s\n' "$COMMIT" > SOURCE-COMMIT.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess, sys
          repo="source-repo"
          root=Path("Black-And-Green-Guitars")
          root.mkdir()
          raw=subprocess.check_output(["git","-C",repo,"ls-tree","-r","-z","HEAD"])
          entries=[x for x in raw.split(b"\0") if x]
          checked=0
          mism=[]
          links=0
          for e in entries:
              meta,path_b=e.split(b"\t",1)
              mode,typ,sha=meta.decode().split()
              if typ!="blob":
                  continue
              path=path_b.decode("utf-8","surrogateescape")
              data=subprocess.check_output(["git","-C",repo,"cat-file","blob",sha])
              h=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              checked+=1
              if h!=sha:
                  mism.append((path,sha,h))
                  continue
              p=root/path
              p.parent.mkdir(parents=True,exist_ok=True)
              if mode=="120000":
                  os.symlink(data.decode("utf-8","surrogateescape"),p)
                  links+=1
              else:
                  p.write_bytes(data)
                  if mode=="100755":
                      p.chmod(0o755)
          Path("BLOB-IDENTITY.txt").write_text(
              f"checked={checked}\nmismatches={len(mism)}\nsymlinks={links}\n"+
              "".join(f"MISMATCH\t{a}\t{b}\t{c}\n" for a,b,c in mism)
          )
          print(Path("BLOB-IDENTITY.txt").read_text())
          if mism:
              sys.exit(1)
          PY
      - name: Validate all WAVs structurally
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, sys
          root=Path("Black-And-Green-Guitars/Samples")
          wavs=sorted(root.rglob("*.wav"))
          bad=[]
          def check(p):
              b=p.read_bytes()
              if len(b)<44 or b[:4]!=b"RIFF" or b[8:12]!=b"WAVE":
                  return "header"
              declared=struct.unpack_from("<I",b,4)[0]+8
              if declared!=len(b):
                  return f"riff-size {declared}!={len(b)}"
              pos=12; got_fmt=False; got_data=False
              while pos+8<=len(b):
                  cid=b[pos:pos+4]
                  n=struct.unpack_from("<I",b,pos+4)[0]
                  end=pos+8+n
                  if end>len(b):
                      return f"chunk {cid!r} overflow"
                  if cid==b"fmt ":
                      got_fmt=True
                  elif cid==b"data":
                      got_data=True
                  pos=end+(n&1)
              if pos!=len(b):
                  return f"trailing/align {pos}!={len(b)}"
              if not got_fmt or not got_data:
                  return "missing fmt/data"
              return None
          for p in wavs:
              why=check(p)
              if why:
                  bad.append((str(p),why))
          Path("SAMPLE-COUNT.txt").write_text(str(len(wavs))+"\n")
          Path("WAV-FAILURES.txt").write_text("".join(f"{why}\t{p}\n" for p,why in bad))
          Path("WAV-VALIDATION.txt").write_text(
              f"total={len(wavs)}\nvalid={len(wavs)-len(bad)}\ninvalid={len(bad)}\n"
          )
          print(Path("WAV-VALIDATION.txt").read_text())
          if len(wavs)!=1776 or bad:
              print(Path("WAV-FAILURES.txt").read_text()[:20000])
              sys.exit(1)
          PY
      - name: Package exact validated payload
        shell: bash
        run: |
          set -euxo pipefail
          test -f 'Black-And-Green-Guitars/Programs/01-green_keyswitch.sfz'
          test -f 'Black-And-Green-Guitars/Programs/02-black_keyswitch.sfz'
          tar -cf black-and-green-guitars.tar Black-And-Green-Guitars
          sha256sum black-and-green-guitars.tar | tee black-and-green-guitars.tar.sha256
          split -b 180M -d -a 2 black-and-green-guitars.tar black-and-green.part-
          sha256sum black-and-green.part-* > PARTS-SHA256SUMS.txt
          PARTS="$(find . -maxdepth 1 -name 'black-and-green.part-*' | wc -l)"
          echo "$PARTS" | tee PART-COUNT.txt
          test "$PARTS" -le 4
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: black-green-blob-manifest
          path: |
            SOURCE-COMMIT.txt
            SAMPLE-COUNT.txt
            BLOB-IDENTITY.txt
            WAV-VALIDATION.txt
            WAV-FAILURES.txt
            black-and-green-guitars.tar.sha256
            PARTS-SHA256SUMS.txt
            PART-COUNT.txt
          retention-days: 1
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: black-green-blob-part-00
          path: black-and-green.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: black-green-blob-part-01
          path: black-and-green.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: black-green-blob-part-02
          path: black-and-green.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: black-green-blob-part-03
          path: black-and-green.part-03
          compression-level: 0
          retention-days: 1
