name: Astra GM2 7zip Runtime
on:
  push:
    branches:
      - tmp/astra-gm2-nam-build-20260920
jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          apt download 7zip
          ls -lh /tmp/7zip*.deb
          sha256sum /tmp/7zip*.deb > /tmp/7zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sevenzip-deb
          path: |
            /tmp/7zip*.deb
            /tmp/7zip.sha256
          compression-level: 0
          retention-days: 1
