name: Black And Blue Bass Bundle
# Sunwell Gateway refresh 2026-09-21

on:
  push:
    branches:
      - linux-ububtu-vm-workspace
    paths:
      - .github/workflows/black-and-blue-bass-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Black And Blue Basses
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          git clone --depth=1 https://github.com/sfzinstruments/karoryfer.black-and-blue-basses.git bundle/Black-And-Blue-Basses
          rm -rf bundle/Black-And-Blue-Basses/.git

      - name: Fetch sfizz Debian package
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4             'https://downloadcontentcdn.opensuse.org/repositories/home:/sfztools:/sfizz:/develop/Debian_Testing/amd64/sfizz_1742242193.99499a8-0_amd64.deb'             -o bundle/sfizz_1742242193.99499a8-0_amd64.deb

      - name: Fetch sfizz compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4             'https://discourse.zynthian.org/uploads/short-url/blgmWyWzEjh07vesEuRigdsDx2w.zip'             -o bundle/Karoryfer-Black-And-Blue-Basses-sfizz-compat.zip

      - name: Record provenance and checksums
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo 'Black And Blue Basses upstream: https://github.com/sfzinstruments/karoryfer.black-and-blue-basses'
            echo 'sfizz package: home:sfztools:sfizz:develop Debian_Testing amd64'
            echo 'sfizz compatibility patch: Zynthian Discourse post #69, 2026-02-22'
            echo
            find bundle -type f -print0 | sort -z | xargs -0 sha256sum
          } > bundle/SHA256SUMS.txt

      - name: Pack and split for connector transfer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p chunks
          tar -cf chunks/black-and-blue-basses-linux-reaper.tar bundle
          sha256sum chunks/black-and-blue-basses-linux-reaper.tar > chunks/TAR-SHA256SUM.txt
          split -b 400M chunks/black-and-blue-basses-linux-reaper.tar chunks/black-and-blue-basses-linux-reaper.tar.part-
          rm chunks/black-and-blue-basses-linux-reaper.tar
          ls -lh chunks
          test -f chunks/black-and-blue-basses-linux-reaper.tar.part-aa
          test -f chunks/black-and-blue-basses-linux-reaper.tar.part-ab
          test -f chunks/black-and-blue-basses-linux-reaper.tar.part-ac
          test ! -f chunks/black-and-blue-basses-linux-reaper.tar.part-ad

      - name: Upload chunk aa
        uses: actions/upload-artifact@v4
        with:
          name: black-and-blue-basses-chunk-aa
          path: chunks/black-and-blue-basses-linux-reaper.tar.part-aa
          compression-level: 0
          retention-days: 1

      - name: Upload chunk ab
        uses: actions/upload-artifact@v4
        with:
          name: black-and-blue-basses-chunk-ab
          path: chunks/black-and-blue-basses-linux-reaper.tar.part-ab
          compression-level: 0
          retention-days: 1

      - name: Upload chunk ac
        uses: actions/upload-artifact@v4
        with:
          name: black-and-blue-basses-chunk-ac
          path: chunks/black-and-blue-basses-linux-reaper.tar.part-ac
          compression-level: 0
          retention-days: 1

      - name: Upload transfer checksum
        uses: actions/upload-artifact@v4
        with:
          name: black-and-blue-basses-transfer-checksum
          path: chunks/TAR-SHA256SUM.txt
          compression-level: 0
          retention-days: 1
