  vsco:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch VSCO 2 CE 1.1.0
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer
          curl -fL --retry 5 --retry-delay 3 'https://codeload.github.com/sgossner/VSCO-2-CE/tar.gz/refs/tags/1.1.0' -o /tmp/vsco.tar.gz
          test "$(sha256sum /tmp/vsco.tar.gz | cut -d' ' -f1)" = 'ac577fd3bc9171560087c8182ef6072f11ae0b63b3c3af9a5f752b91e26d3b96'
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('/tmp/vsco.tar.gz'); out=Path('transfer'); chunk=90*1024*1024
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
              return h.hexdigest()
          parts=[]
          with src.open('rb') as f:
              i=0
              while True:
                  b=f.read(chunk)
                  if not b: break
                  p=out/f'vsco-2-ce-1.1.0.tar.gz.part.{i:03d}'; p.write_bytes(b)
                  parts.append({'index':i,'name':p.name,'size':len(b),'sha256':sha(p)}); i+=1
          m={'logical_name':'vsco-2-ce-1.1.0.tar.gz','logical_size':src.stat().st_size,'logical_sha256':sha(src),'upstream_tag':'1.1.0','parts':parts}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
